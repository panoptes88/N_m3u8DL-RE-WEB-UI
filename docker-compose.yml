services:
  m3u8dl:
    build: .
    container_name: m3u8dl
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
      - ./db:/app/db
    environment:
      - ADMIN_PASSWORD=admin123
      - PORT=8080
      - DB_PATH=/app/db/data.db
      # 安全优化配置
      - ALLOW_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
      - ALLOW_INSECURE=true
      # 下载超时配置（秒），0表示不限制
      - DOWNLOAD_TIMEOUT=0
      # 时区配置
      - TZ=Asia/Shanghai
      # 语言/字符集配置（使容器内中文文件名正常显示，避免 ls 转义）
      - LANG=C.UTF-8
    restart: unless-stopped
    healthcheck:
      # 原检查有两个问题：最终镜像里没有 wget，且 /api/user 需要登录、
      # 未登录恒返回 401，因此容器永远不可能变为 healthy。
      # 改为用镜像内已有的 bash 直接发一个 HTTP 请求打 /api/health，
      # 并校验响应体，避免被 SPA 兜底路由的 200 骗过。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"ok"' <&3
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
